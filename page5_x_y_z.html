<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最終問題 - 世界の特異点</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            text-align: center;
            background-color: #1a1a1a; /* 最後なので少し重厚な黒に */
            color: #eee;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2c2c2c;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        h2 {
            color: #e74c3c;
            font-size: 1.8em;
            letter-spacing: 0.1em;
            margin-bottom: 30px;
            border-bottom: 2px solid #e74c3c;
            display: inline-block;
            padding-bottom: 10px;
        }
        .riddle-text {
            font-size: 1.1em;
            text-align: left;
            margin: 30px 0;
            padding: 20px;
            background: #333;
            border-left: 4px solid #e74c3c;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border: 1px solid #555;
            border-radius: 4px;
        }
        .footer-note {
            margin-top: 40px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>【最終問題】</h2>

        <img src="image8.png" alt="Final Riddle">

    </div>
</body>
</html>
