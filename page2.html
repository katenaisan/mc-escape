<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解き - 第2問</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #1a252f;
        }
        #error-msg {
            color: #e74c3c;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>第2の謎</h2>
        <p>新たな画像と今いる場所の情報を照らし合わせ、答えを導き出せ。</p>

        <img src="image3.png" alt="謎2の画像1">
        <img src="image4.png" alt="謎2の画像2">

        <p>出てきた文を入力して次の問題に進め</p>

        <div>
            <input type="text" id="answer" placeholder="答えを入力">
            <br>
            <button onclick="checkAnswer()">解答する</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <script>
        function checkAnswer() {
            // 入力された文字を取得（前後の空白を消去）
            let input = document.getElementById("answer").value.trim();
            let errorMsg = document.getElementById("error-msg");

            // ★ココを書き換える：第2問の正解キーワードを設定してください★
            const correctAnswer = "シゲンサバニイケ";

            if (input === correctAnswer) {
                // 正解の場合、page3.html へ遷移する
                window.location.href = "page3.html";
            } else {
                // 不正解の場合
                errorMsg.innerText = "答えが違います。もう一度考えてみましょう。";
            }
        }
    </script>
</body>
</html>
